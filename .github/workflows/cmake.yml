name: CMake

# This fork runs the upstream build matrix on demand only: the full matrix is
# expensive, and firing it on every push and every pull request costs more than
# the signal is worth here. Upstream keeps its own push/pull_request triggers.
on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        cmake_generator: [ default, Ninja ]
      fail-fast: false
    name:  ${{ matrix.os }} build
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: "recursive"

    - name: Setting up Ninja build system
      if: matrix.cmake_generator == 'Ninja'
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Set up MSVC compiler
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake with ${{ matrix.cmake_generator }}
      if: matrix.cmake_generator != 'default'
      run: cmake -G ${{ matrix.cmake_generator }} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTING:BOOL=true

    - name: Configure CMake with default generator
      if: matrix.cmake_generator == 'default'
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTING:BOOL=true

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    # `ctest` exits 0 when the build registers no test at all, so a run that
    # tests nothing is indistinguishable from a run in which everything passed.
    # `--no-tests=error` turns that case into a failure. It is inert in `-N`
    # listing mode, though: a listing exits 0 whether or not anything matched,
    # so the check below reads what the listing PRINTS rather than its status.
    # `--no-tests=error` needs CTest 3.20 or newer.
    - name: Assert that the build registers at least one test
      shell: bash
      run: |
        set -uo pipefail
        listing=$(ctest --test-dir ${{github.workspace}}/build -C Release -N)
        printf '%s\n' "${listing}"
        if printf '%s\n' "${listing}" | grep -q 'Total Tests: 0'; then
          echo "FAILURE: the build tree registers no test at all."
          exit 1
        fi

    - name: Run Tests
      run: ctest --test-dir ${{github.workspace}}/build --no-tests=error -C Release --output-on-failure
