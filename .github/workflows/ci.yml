# The T0 job matrix.
#
# THIS MATRIX IS T0 ONLY, AND IT ALWAYS WILL BE. No T1 job, no T2 job and no
# integer-comparison job runs here. All of them need a firmware byte, and no
# public repository may hold a credential that could fetch one. Those jobs run
# inside the private artifact repository instead. T0 only is what lets every job
# here run on a pull request from a fork.
#
# EVERY PER-TRACK UNIT IS A REUSABLE WORKFLOW AND IT CONTRIBUTES A JOB.
# GitHub resolves a local reusable workflow only as `./.github/workflows/<file>`.
# A file under `.github/jobs/` is not resolvable by `uses:` and never runs.
# Nothing outside a callee workflow can insert a step into it, so each track
# declares one job in its own file and adds its steps there.
#
# A merge of every track's branch touches this file in ZERO places.

# CI is manual. Automatic push/pull_request runs were removed because the
# three-OS matrix cost hours of runner time per push. Start a run from the
# Actions tab or with `gh workflow run`.

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# THE T0 SUITE IS EVERY REGISTERED TEST, SELECTED BY NO FILTER AT ALL.
# This repository may register only firmware-free tests, for the reason given
# above: a public repository holds no credential that could fetch a firmware
# byte, so a test needing one cannot run here and is not registered here. The
# registered set therefore IS the T0 set, and a `-R` filter over it can only
# subtract.
#
# DO NOT REINTRODUCE A `-R` NAME FILTER HERE. The one that stood here,
# `-R '^dsp56k_'`, matched none of the names the tree actually registers, which
# are camelCase or underscore-suffixed rather than `dsp56k_`-prefixed. A filter
# naming a convention the tree does not follow says nothing about the mismatch:
# `--no-tests=error` turned it into a failure, but the failure pointed at the
# pattern and not at the drift, and every added test would have been silently
# skipped had the flag been absent. Selecting everything cannot drift, and
# `--no-tests=error` still fails loudly if the tree ever registers nothing.
#
# A test that must NOT run here does not belong in a `-R` exception; it belongs
# outside this repository, per the T0-only rule above.

jobs:
  build-and-t0:
    name: build-and-t0
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-arm64 is EXCLUDED here, not unsupported. macOS/arm64 is the
          # development platform and is exercised locally. It left CI after
          # gearmulator's inherited CMake run 31033322092, where the macOS jobs
          # were CANCELLED at >=4h 32m without completing, against 19m 46s for
          # the comparable Ubuntu job: >=13.8x, and unbounded, because a
          # cancelled job gives a lower bound and not a duration. That run
          # measures a CMake build in another repository. No equivalent
          # measurement exists for this repository's own build.
          # Uncomment the two lines below to restore the macOS job.
          # - target: macos-arm64
          #   runs-on: macos-14
          - target: linux-x86-64
            runs-on: ubuntu-latest
          - target: windows-x86-64
            runs-on: windows-2022
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CTest 3.20 is the floor because `--no-tests=error` is a CTest flag and
      # the earlier releases do not carry it. Without that flag every `-R` check
      # in this project passes against no code at all.
      - name: Require CMake and CTest 3.20 or newer
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ctest --version
          have=$(cmake --version | head -1 | grep -Eo '[0-9]+\.[0-9]+' | head -1)
          major=${have%%.*}
          minor=${have##*.}
          if [ "${major}" -lt 3 ] || { [ "${major}" -eq 3 ] && [ "${minor}" -lt 20 ]; }; then
            echo "FAILURE: CMake ${have} is older than the 3.20 floor."
            exit 1
          fi

      # BOTH THE BUILD TYPE AND THE CONFIG FLAG ARE REQUIRED, AND NEITHER IS
      # REDUNDANT. `CMAKE_BUILD_TYPE` selects the configuration on a
      # single-config generator (the Makefiles/Ninja default on ubuntu-latest)
      # and is IGNORED on a multi-config one. The windows-2022 default generator
      # is Visual Studio 17 2022, which is multi-config: there
      # `CMAKE_BUILD_TYPE` does nothing and `cmake --build` with no `--config`
      # builds Debug. `--config` is in turn ignored by a single-config
      # generator. Passing both is what makes every leg of the matrix actually
      # build Release.
      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      # THE LISTING TEXT IS THE MECHANISM AND THE EXIT CODE IS NOT.
      # `--no-tests=error` governs a test RUN. In `-N` listing mode it is inert:
      # the listing exits 0 whether or not any test matched. So this step reads
      # what the listing PRINTS.
      - name: Assert that the build registers at least one test
        shell: bash
        run: |
          set -uo pipefail
          listing=$(ctest --test-dir build --no-tests=error -C Release -N)
          printf '%s\n' "${listing}"
          if printf '%s\n' "${listing}" | grep -q 'Total Tests: 0'; then
            echo "FAILURE: the build tree of ${GITHUB_REPOSITORY} registers no test at all."
            exit 1
          fi

      # `-C` IS NOT OPTIONAL ON A MULTI-CONFIG GENERATOR, AND THE LISTING WILL
      # NOT WARN YOU. A multi-config build writes one config-guarded `add_test`
      # per configuration plus an `add_test(<name> NOT_AVAILABLE)` else-branch.
      # With no `-C`, `ctest -N` still PRINTS every test, so the listing step
      # above passes -- and then every test resolves to NOT_AVAILABLE and fails
      # as "Not Run". The config must be named here as well as at build time.
      - name: Run the T0 suite
        shell: bash
        run: ctest --test-dir build --no-tests=error -C Release --output-on-failure
